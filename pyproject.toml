[project]
name = "music-mcp"
version = "2.0.0"
description = "MCP server that identifies songs from audio files (ACRCloud) and saves them to Spotify."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmet Mervan Erman", email = "ahmetmervanerman@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "spotify", "acrcloud", "music-recognition", "llm", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Precise trimming of long recordings (needs ffmpeg on PATH). Without it, a byte-range sample is sent.
audio = ["pydub>=0.25", "audioop-lts>=0.2; python_version >= '3.13'"]

[project.scripts]
music-mcp = "music_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/Hoxofp/Music_MCP"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
